
name: Build Lynec Music Player APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/Lynec-Music-Player.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lynec-build-${{ github.run_number }}
          name: Lynec Music Player Build ${{ github.run_number }}
          body: |
            Lynec Music Player APK
            Automatically built from the latest main branch.
          files: release/Lynec-Music-Player.apk
          make_latest: true
          fail_on_unmatched_files: true
